name: ZAP Baseline Scan

on:
  schedule:
    - cron: "30 1 * * *"

  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: zap-baseline-production
  cancel-in-progress: true

jobs:
  zap_scan:
    name: Scan vigdalpi.duckdns.org
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: "https://vigdalpi.duckdns.org/"
          fail_action: false
          allow_issue_writing: true
          issue_title: "ZAP Baseline Report - vigdalpi.duckdns.org"
          artifact_name: "zap-baseline-report"