services:
  web:
    image: adriansvevside-web
    build:
      context: .
      dockerfile: Dockerfile.pi
    container_name: adriansvevside
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: "Europe/Oslo"
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      Frost__ClientId: ${FROST_CLIENT_ID:-}
      Frost__ClientSecret: ${FROST_CLIENT_SECRET:-}
      FootballData__ApiKey: ${FOOTBALLDATA_API_KEY:-}
      UptimeKuma__Enabled: "true"
      UptimeKuma__BaseUrl: "http://host.docker.internal:3001/"
      UptimeKuma__StatusPageSlug: "vigdalpi"
      UptimeKuma__CacheSeconds: "60"
    expose:
      - "8080"
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
      - ./Adrians/wwwroot/status:/app/wwwroot/status:ro

  nginx:
    image: nginx:1.29-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_conf:/etc/nginx/conf.d
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
      - nginx_cache:/var/cache/nginx

volumes:
  nginx_conf:
  certbot_www:
  letsencrypt:
  nginx_cache:
  dataprotection_keys:
